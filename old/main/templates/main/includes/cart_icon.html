{% load static %}
<!-- Иконка корзины -->
<div class="cart-icon-wrapper s" style="position: fixed !important; top: 130px !important; right: 15px !important;" >
    <div class="cart-icon" id="cartIcon" onclick="goToCart()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
        <span class="cart-count" id="cartCount">0</span>
    </div>
</div>

<style>
.cart-icon-wrapper {
    position:  relative;
    z-index: 1000;
    width: 60px;
    height: 60px;
}

.cart-icon {
    position: relative;
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #e08e8f 0%, #d17a7b 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(224, 142, 143, 0.4);
    transition: all 0.3s ease;
    color: white;
}

.cart-icon:hover {
    transform: scale(1.1);
    box-shadow: 0 12px 30px rgba(224, 142, 143, 0.6);
}

.cart-count {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #ff4757;
    color: white;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 600;
    font-family: 'Montserrat', sans-serif;
    box-shadow: 0 2px 8px rgba(255, 71, 87, 0.4);
}

/* Адаптивность */
@media (max-width: 768px) {
    .cart-icon-wrapper {
        
    }
    .s{
        display: none !important;
    }

    .cart-icon {
        width: 50px;
        height: 50px;
    }

    .cart-count {
        width: 20px;
        height: 20px;
        font-size: 0.7rem;
    }
}

@media (max-width: 480px) {
    .cart-icon-wrapper {
        
    }
}
</style>

<script>
// Функция для перехода в корзину
function goToCart() {
    window.location.href = '{% url "cart_view" %}';
}

// Функция обновления счетчика корзины
function updateCartCounter() {
    // Сначала проверяем localStorage для мгновенного отображения
    const cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
    const totalItems = cartItems.reduce((total, item) => total + (item.quantity || 1), 0);

    const cartCount = document.getElementById('cartCount');
    const cartIcon = document.getElementById('cartIcon');

    if (cartCount) {
        cartCount.textContent = totalItems;
    }

    if (cartIcon) {
        if (totalItems > 0) {
            cartIcon.style.display = 'flex';
        } else {
            cartIcon.style.display = 'none';
        }
    }

    // Затем синхронизируем с сервером
    fetch('/cart/count/')
        .then(response => response.json())
        .then(data => {
            if (cartCount && data.count !== undefined) {
                cartCount.textContent = data.count;
            }

            if (cartIcon) {
                if (data.count > 0) {
                    cartIcon.style.display = 'flex';
                } else {
                    cartIcon.style.display = 'none';
                }
            }
        })
        .catch(error => {
            console.error('Error updating cart counter:', error);
        });
}

// Функция для синхронизации корзины с сервером
function syncCartWithServer() {
    fetch('/cart/items/')
        .then(response => response.json())
        .then(data => {
            if (data.items) {
                // Преобразуем данные сервера в формат localStorage
                const serverCartItems = data.items.map(item => ({
                    id: item.product_id,
                    quantity: item.quantity,
                    addedAt: new Date().toISOString()
                }));
                localStorage.setItem('cartItems', JSON.stringify(serverCartItems));

                // Обновляем счетчик
                updateCartCounter();
            }
        })
        .catch(error => {
            console.error('Error syncing cart with server:', error);
        });
}

// Инициализация при загрузке страницы
document.addEventListener('DOMContentLoaded', function() {
    // Загружаем начальное состояние корзины
    updateCartCounter();

    // Синхронизируем с сервером
    syncCartWithServer();

    const cartIcon = document.getElementById('cartIcon');
    if (cartIcon) {
        cartIcon.style.cursor = 'pointer';
        cartIcon.addEventListener('click', goToCart);
    }
});

// Делаем функцию глобально доступной
window.updateCartCounter = updateCartCounter;
window.syncCartWithServer = syncCartWithServer;
</script>
