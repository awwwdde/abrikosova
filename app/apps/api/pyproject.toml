[project]
name = "abrikosova-api"
version = "0.1.0"
description = "FastAPI-бэкенд сайта кондитерской Елены Абрикосовой"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "python-multipart>=0.0.20",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E,F — pyflakes/pycodestyle; I — сортировка импортов; B — bugbear;
# BLE — запрет голых except (прямой ответ на ANALYSIS.md, п. 2.1.5);
# T20 — запрет print() в коде (там же).
select = ["E", "F", "I", "B", "UP", "BLE", "T20"]

[tool.ruff.lint.per-file-ignores]
# Файлы миграций генерирует Alembic — переносы строк в них не наши, править вручную бессмысленно
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
