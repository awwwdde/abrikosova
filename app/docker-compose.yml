# Только для локальной разработки.
# Порты на хосте переопределяются через app/.env (см. .env.example) — на случай,
# когда 5432/8000 уже заняты другим проектом на той же машине.
# На проде (Timeweb Cloud) postgres и redis — управляемые сервисы,
# см. new/spec/00-overview.md, раздел «Инфраструктура».

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: abrikosova
      POSTGRES_PASSWORD: abrikosova
      POSTGRES_DB: abrikosova
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abrikosova"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-совместимое хранилище только для локальной разработки.
  # На проде вместо него — S3 Object Storage Timeweb Cloud, код тот же.
  #
  # Образ не официальный: MinIO прекратил публикацию community-образов
  # (minio/minio на Docker Hub больше не скачивается, quay.io отвечает 401).
  # pgsty/minio — сборка community-версии от проекта Pigsty
  # (https://github.com/pgsty/minio), внутри тот же сервер и клиент mc.
  # Тег зафиксирован ради воспроизводимости: latest однажды привезёт
  # несовместимую версию незаметно. Обновление: выбрать новый RELEASE.* на
  # https://hub.docker.com/r/pgsty/minio/tags, поменять тег здесь, выполнить
  # `docker compose up -d minio` и убедиться, что сервис стал healthy.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${S3_HOST_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: dev
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://abrikosova:abrikosova@postgres:5432/abrikosova
      REDIS_URL: redis://redis:6379/0
      # Внутри сети — имя сервиса, наружу изображения отдаются по порту хоста
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: http://localhost:${S3_HOST_PORT:-9000}/abrikosova
      S3_BUCKET: abrikosova
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      # Сброс ISR-кэша фронтенда после правок в админке
      WEB_REVALIDATE_URL: http://web:3000/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET не задан в app/.env}
    # Воспроизводимое окружение с первого дня: миграции и сид накатываются на старте
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/srv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ./apps/web
      target: dev
    env_file:
      - ./apps/web/.env
    environment:
      API_URL: http://api:8000/api/v1
      # Адрес для браузера должен совпадать с портом, проброшенным на хост
      NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-8000}/api/v1
      # Браузер ходит за картинками на сам сайт, Next проксирует в MinIO
      NEXT_PUBLIC_MEDIA_URL: /media
      MEDIA_INTERNAL_URL: http://minio:9000/abrikosova
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET не задан в app/.env}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/srv
      - /srv/node_modules
      - /srv/.next
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
